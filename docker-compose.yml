# =============================================================================
# Suphasan Data Warehouse - Full Stack Docker Compose
# =============================================================================
# Services:
#   1. postgres       - OLTP database + metadata store for Airflow & Superset
#   2. redis          - Caching for Superset + message broker for Airflow
#   3. web            - Django application (Suphasan storefront & admin)
#   4. superset       - Apache Superset BI dashboards
#   5. superset-init  - One-shot init container for Superset setup
#   6. airflow-init   - One-shot init container for Airflow DB + admin user
#   7. airflow-web    - Airflow webserver (DAG management UI)
#   8. airflow-sched  - Airflow scheduler (triggers DAG runs)
#   9. nginx           - Reverse proxy routing
# =============================================================================

services:
  # ===========================================================================
  # 1. PostgreSQL — OLTP Source + Metadata Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: suphasan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suphasan-network

  # ===========================================================================
  # 2. Redis — Cache & Message Broker
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: suphasan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suphasan-network

  # ===========================================================================
  # ===========================================================================
  # 4. Django Web Application
  # ===========================================================================
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: suphasan-django
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    volumes:
      - ./app:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 5. Apache Superset — Business Intelligence
  # ===========================================================================
  superset:
    build: ./superset
    container_name: suphasan-superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_DB: superset_meta
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
        /app/docker/entrypoints/run-server.sh
      "
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 6. Superset Init (one-shot bootstrap)
  # ===========================================================================
  superset-init:
    build: ./superset
    container_name: suphasan-superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_DB: superset_meta
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL...' &&
        /app/.venv/bin/python -m pip install psycopg2-binary &&
        superset db upgrade &&
        superset fab create-admin --username $${SUPERSET_ADMIN_USERNAME} --firstname Admin --lastname Suphasan --email $${SUPERSET_ADMIN_EMAIL} --password $${SUPERSET_ADMIN_PASSWORD} || true &&
        superset init &&
        echo 'Superset init complete!'
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 7. Airflow Init (one-shot bootstrap)
  # ===========================================================================
  airflow-init:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Suphasan \
          --role Admin \
          --email admin@suphasan.com || true &&
        echo 'Airflow init complete!'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 8. Airflow Webserver
  # ===========================================================================
  airflow-web:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-web
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 9. Airflow Scheduler
  # ===========================================================================
  airflow-sched:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 10. Nginx — Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: suphasan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/var/www/static:ro
    depends_on:
      - web
      - superset
      - airflow-web
    networks:
      - suphasan-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: suphasan-postgres-data
  redis_data:
    name: suphasan-redis-data
  superset_home:
    name: suphasan-superset-home
  django_static:
    name: suphasan-django-static
  django_media:
    name: suphasan-django-media
  airflow_logs:
    name: suphasan-airflow-logs

# =============================================================================
# Networks
# =============================================================================
networks:
  suphasan-network:
    name: suphasan-network
    driver: bridge
