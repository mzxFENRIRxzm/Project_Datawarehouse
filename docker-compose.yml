# =============================================================================
# Suphasan Data Warehouse - Full Stack Docker Compose
# =============================================================================
# Services:
#   1. postgres       - OLTP database + metadata store for Airflow & Superset
#   2. redis          - Caching for Superset + message broker for Airflow
#   3. web            - Django application (Suphasan storefront & admin)
#   4. superset       - Apache Superset BI dashboards
#   5. superset-init  - One-shot init container for Superset setup
#   6. airflow-init   - One-shot init container for Airflow DB + admin user
#   7. airflow-web    - Airflow webserver (DAG management UI)
#   8. airflow-sched  - Airflow scheduler (triggers DAG runs)
#   9. nginx           - Reverse proxy routing
# =============================================================================

services:
  # ===========================================================================
  # 1. PostgreSQL — OLTP Source + Metadata Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: suphasan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suphasan-network

  # ===========================================================================
  # 2. Redis — Cache & Message Broker
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: suphasan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suphasan-network

  # ===========================================================================
  # ===========================================================================
  # 4. Django Web Application
  # ===========================================================================
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: suphasan-django
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    volumes:
      - ./app:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 5. Apache Superset — Business Intelligence
  # ===========================================================================
  superset:
    build: ./superset
    container_name: suphasan-superset
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_DB: superset_meta
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/bootstrap_dashboard.py:/app/pythonpath/bootstrap_dashboard.py:ro
    command: >
      bash -c "
        /app/docker/entrypoints/run-server.sh
      "
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lakehouse-trino:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 6. Superset Init (one-shot bootstrap)
  # ===========================================================================
  superset-init:
    build: ./superset
    container_name: suphasan-superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_DB: superset_meta
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/init.sh:/app/pythonpath/init.sh:ro
      - ./superset/bootstrap_admin.py:/app/pythonpath/bootstrap_admin.py:ro
    command: ["bash", "/app/pythonpath/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 7. Airflow Init (one-shot bootstrap)
  # ===========================================================================
  airflow-init:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Suphasan \
          --role Admin \
          --email admin@suphasan.com || true &&
        echo 'Airflow init complete!'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 8. Airflow Webserver
  # ===========================================================================
  airflow-web:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-web
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 9. Airflow Scheduler
  # ===========================================================================
  airflow-sched:
    image: apache/airflow:2.10.2-python3.11
    container_name: suphasan-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 10. Lakehouse Object Storage
  # ===========================================================================
  lakehouse-minio:
    image: quay.io/minio/minio:latest
    container_name: suphasan-lakehouse-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${LAKEHOUSE_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${LAKEHOUSE_MINIO_PASSWORD}
    volumes:
      - lakehouse_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suphasan-network

  lakehouse-minio-init:
    image: quay.io/minio/mc:latest
    container_name: suphasan-lakehouse-minio-init
    depends_on:
      lakehouse-minio:
        condition: service_healthy
    environment:
      LAKEHOUSE_MINIO_USER: ${LAKEHOUSE_MINIO_USER}
      LAKEHOUSE_MINIO_PASSWORD: ${LAKEHOUSE_MINIO_PASSWORD}
    entrypoint: >
      /bin/sh -ec "
      mc alias set lakehouse http://lakehouse-minio:9000 \"$${LAKEHOUSE_MINIO_USER}\" \"$${LAKEHOUSE_MINIO_PASSWORD}\";
      mc mb --ignore-existing lakehouse/warehouse;
      "
    networks:
      - suphasan-network

  # ===========================================================================
  # 11. Lakehouse Catalog and SQL Engine
  # ===========================================================================
  lakehouse-db-init:
    image: postgres:16-alpine
    container_name: suphasan-lakehouse-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h postgres -U ${POSTGRES_USER} -d postgres -v ON_ERROR_STOP=1
        -tc "SELECT 1 FROM pg_database WHERE datname = 'metastore'"
        | grep -q 1 || psql -h postgres -U ${POSTGRES_USER} -d postgres
        -v ON_ERROR_STOP=1 -c "CREATE DATABASE metastore";
        psql -h postgres -U ${POSTGRES_USER} -d postgres
        -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE metastore TO ${POSTGRES_USER}";
    networks:
      - suphasan-network

  lakehouse-hive-metastore:
    build:
      context: ./lakehouse
      dockerfile: Dockerfile
    container_name: suphasan-lakehouse-metastore
    restart: unless-stopped
    depends_on:
      lakehouse-db-init:
        condition: service_completed_successfully
      lakehouse-minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: /opt/hive/lib/postgresql.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
      HIVE_AUX_JARS_PATH: /opt/hive/lib/postgresql.jar,/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar,/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
      METASTORE_DB_URL: jdbc:postgresql://postgres:5432/metastore
      METASTORE_DB_USER: ${POSTGRES_USER}
      METASTORE_DB_PASS: ${POSTGRES_PASSWORD}
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_MINIO_PASSWORD}
      MINIO_ENDPOINT: http://lakehouse-minio:9000
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    ports:
      - "127.0.0.1:9083:9083"
    networks:
      - suphasan-network

  lakehouse-trino:
    image: trinodb/trino:438
    container_name: suphasan-lakehouse-trino
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      LAKEHOUSE_MINIO_USER: ${LAKEHOUSE_MINIO_USER}
      LAKEHOUSE_MINIO_PASSWORD: ${LAKEHOUSE_MINIO_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      lakehouse-hive-metastore:
        condition: service_started
      lakehouse-minio:
        condition: service_healthy
      lakehouse-minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config/trino/node.properties:/etc/trino/node.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./config/trino/catalog/postgresql.properties:/etc/trino/catalog/postgresql.properties:ro
    networks:
      - suphasan-network

  northwind-etl:
    profiles: ["lakehouse-jobs"]
    build:
      context: .
      dockerfile: lakehouse/pipeline.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LAKEHOUSE_MINIO_USER: ${LAKEHOUSE_MINIO_USER}
      LAKEHOUSE_MINIO_PASSWORD: ${LAKEHOUSE_MINIO_PASSWORD}
      MINIO_ENDPOINT: http://lakehouse-minio:9000
      TRINO_HOST: lakehouse-trino
      TRINO_PORT: 8080
    volumes:
      - ./data/landing/northwind_thai_large_data:/workspace/data/landing/northwind_thai_large_data:ro
    depends_on:
      lakehouse-trino:
        condition: service_healthy
    networks:
      - suphasan-network

  # ===========================================================================
  # 12. Nginx — Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: suphasan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/var/www/static:ro
    depends_on:
      - web
      - superset
      - airflow-web
    networks:
      - suphasan-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: suphasan-postgres-data
  redis_data:
    name: suphasan-redis-data
  superset_home:
    name: suphasan-superset-home
  django_static:
    name: suphasan-django-static
  django_media:
    name: suphasan-django-media
  airflow_logs:
    name: suphasan-airflow-logs
  lakehouse_minio_data:
    name: suphasan-lakehouse-minio-data

# =============================================================================
# Networks
# =============================================================================
networks:
  suphasan-network:
    name: suphasan-network
    driver: bridge
