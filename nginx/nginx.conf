# =============================================================================
# Nginx Reverse Proxy Configuration for Suphasan Data Warehouse
# =============================================================================
# Routes:
#   /            → Django (port 8000)
#   /superset/   → Apache Superset (port 8088)
#   /airflow/    → Apache Airflow (port 8080)
#   /static/     → Static files volume
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ---- Upstream servers ----
    upstream django {
        server web:8000;
    }

    upstream superset {
        server superset:8088;
    }

    upstream airflow {
        server airflow-web:8080;
    }

    # ---- Main server block ----
    server {
        listen 80;
        server_name localhost;

        # --- Django Application (default) ---
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static Files ---
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # --- Apache Superset (BI Dashboards) ---
        location /superset/ {
            proxy_pass http://superset/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # --- Apache Airflow (ETL Management) ---
        location /airflow/ {
            proxy_pass http://airflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # --- Health Check ---
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
